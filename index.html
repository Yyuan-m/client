<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LUXURY CAR 豪华汽车租赁 - 专注高端租车服务" />
    <title>LUXURY CAR · 豪华汽车租赁</title>
    <!-- Inter 字体（FerrariSans 开源替代） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* 首屏加载占位 - Ferrari 暗色画布 */
      #app-loading {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #181818; z-index: 9999; transition: opacity .4s;
      }
      #app-loading.hide { opacity: 0; pointer-events: none; }
      #app-loading .dot {
        width: 10px; height: 10px; border-radius: 50%; background: #da291c;
        animation: dotPulse 1s infinite ease-in-out;
      }
      @keyframes dotPulse {
        0%, 100% { transform: scale(0.6); opacity: 0.4; }
        50% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loading"><div class="dot"></div></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
